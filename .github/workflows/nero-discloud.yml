name: Nero - Pacote Discloud
on:
  push:
    branches:
      - main
      - feature/nero-v41-modulos
      - feature/nero-v42-boasvindas
      - feature/nero-v43-reunioes
      - feature/nero-v451-formularios
      - feature/nero-v452-paineis
      - feature/nero-v454-relatorios
      - feat/presenca-sem-hora-extra-20261122
      - feat/v4-logs-bate-ponto-automativo
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preparar:
    runs-on: ubuntu-latest
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4
      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Verificar código do Nero
        run: |
          npm run check
          node --check src/nero-modules.js
          node --check src/meeting-v2.js
          node --check src/meeting-form.js
          node --check src/welcome-card.js
          node --test test/meeting-form.test.js
          node --test test/nero-modules.test.js test/welcome.test.js test/meeting-v2.test.js
          python3 -m pip install pillow
          python3 scripts/make-nero-v43-banners.py
          node --test tests/core.test.js tests/attendance.test.js tests/presence-reports.test.js tests/ui.test.js tests/log-setup.test.js tests/invite-inbox.test.js tests/web-config.test.js tests/panel-sync.test.js tests/receipt-dm.test.js tests/receipt.test.js tests/warnings.test.js tests/date-br.test.js
      - name: Montar ZIP da Discloud
        run: |
          zip -q -r Nero-Discloud-v4.5.4.zip index.js discloud.config package.json src assets NERO-V41-MODULOS.md
          unzip -l Nero-Discloud-v4.5.4.zip | sed -n '1,25p'
      - name: Publicar pacote
        uses: actions/upload-artifact@v4
        with:
          name: Nero-Discloud-v4.5.4
          path: Nero-Discloud-v4.5.4.zip
          retention-days: 30
