name: Nero - Pacote Discloud
on:
  push:
    branches:
      - main
      - feature/nero-v41-modulos
      - feat/presenca-sem-hora-extra-20261122
      - feat/v4-logs-bate-ponto-automativo
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preparar:
    runs-on: ubuntu-latest
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4
      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Verificar código do Nero
        run: |
          npm run check
          node --check src/nero-modules.js
          node --test test/nero-modules.test.js
          python3 -m pip install pillow
          python3 -c "from PIL import Image; from pathlib import Path; files=[Path('assets') / ('nero-'+k+'.gif') for k in ('meeting','support','course')]; images=[Image.open(p) for p in files]; assert all(i.n_frames == 16 for i in images); [(i.seek(f), i.load()) for i in images for f in range(i.n_frames)]"
          node --test tests/core.test.js tests/attendance.test.js tests/presence-reports.test.js tests/ui.test.js tests/log-setup.test.js tests/invite-inbox.test.js tests/web-config.test.js tests/panel-sync.test.js tests/receipt-dm.test.js tests/receipt.test.js tests/warnings.test.js tests/date-br.test.js
      - name: Montar ZIP da Discloud
        run: |
          zip -q -r Nero-Discloud-v4.1.0.zip index.js discloud.config package.json src assets NERO-V41-MODULOS.md
          unzip -l Nero-Discloud-v4.1.0.zip | head -25
      - name: Publicar pacote
        uses: actions/upload-artifact@v4
        with:
          name: Nero-Discloud-v4.1.0
          path: Nero-Discloud-v4.1.0.zip
          retention-days: 30
